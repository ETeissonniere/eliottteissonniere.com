<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{- $pageTitle := .Title -}}
    {{- if .IsHome -}}
        {{- $pageTitle = .Site.Title -}}
    {{- else -}}
        {{- $pageTitle = printf "%s - %s" .Title .Site.Title -}}
    {{- end -}}
    <title>{{ $pageTitle }}</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="{{ .Site.Params.description }}">
    <meta name="author" content="{{ .Site.Params.author }}">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{ $pageTitle }}">
    <meta property="og:description" content="{{ .Site.Params.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ .Site.BaseURL }}{{ strings.TrimPrefix "/" .Site.Params.ogImage }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="{{ .Site.Title }}">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@EliottTeiss">
    <meta name="twitter:creator" content="@EliottTeiss">
    <meta name="twitter:title" content="{{ $pageTitle }}">
    <meta name="twitter:description" content="{{ .Site.Params.description }}">
    <meta name="twitter:image" content="{{ .Site.BaseURL }}{{ strings.TrimPrefix "/" .Site.Params.ogImage }}">

    {{ block "css" . }}{{ end }}
</head>
<body>
    {{ block "main" . }}{{ end }}
</body>
</html>
